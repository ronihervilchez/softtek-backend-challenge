service: softtek-backend-challenge

frameworkVersion: "3"

plugins:
  - serverless-dotenv-plugin
  - serverless-offline
  - serverless-esbuild

useDotenv: true

custom:
  dotenv:
    path: .env.${opt:stage, 'dev'}
  serverless-offline:
    port: 3000
    printOutput: true
    cacheInvalidationRegex: "node_modules/"
    noPrependStageInUrl: true
  esbuild:
    bundle: true
    minify: true
    sourcemap: true
    target: node20
    define:
      'require.resolve': undefined
    platform: node
    concurrency: 10

provider:
  name: aws
  runtime: nodejs20.x
  memorySize: 192
  timeout: 120
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  endpointType: REGIONAL
  environment:
    STAGE: ${opt:stage, 'dev'}
    AWS_REGION: ${opt:region, 'us-east-1'}
    NODE_ENV: ${env:NODE_ENV, 'development'}

functions:
  # Función pública para health check
  healthCheck:
    handler: src/handlers/health.handler
    description: Health check endpoint (público)
    events:
      - http:
          integration: lambda-proxy
          method: GET
          path: /health
          cors: true

  # Función pública para documentación Swagger UI
  swaggerDocs:
    handler: src/handlers/swagger.handler
    description: Swagger UI documentation endpoint (público)
    events:
      - http:
          integration: lambda-proxy
          method: GET
          path: /docs
          cors: true
      - http:
          integration: lambda-proxy
          method: GET
          path: /docs/{proxy+}
          cors: true

package:
  patterns:
    - "!.git/**"
    - "!.vscode/**"
    - "!README.md"
    - "!mocks/**"
    - "!node_modules/**"
    - package.json
    - package-lock.json
