service: softtek-backend-challenge

frameworkVersion: "3"

plugins:
  - serverless-dotenv-plugin
  - serverless-offline
  - serverless-esbuild

useDotenv: true

custom:
  dotenv:
    path: .env.${opt:stage, 'dev'}
  serverless-offline:
    port: 4000
    printOutput: true
    cacheInvalidationRegex: "node_modules/"
    noPrependStageInUrl: true
  esbuild:
    bundle: true
    minify: true
    sourcemap: true
    target: node20
    define:
      'require.resolve': undefined
    platform: node
    concurrency: 10
  # Configuración de DynamoDB
  dynamodb:
    dataTable: ${self:provider.stage}-softtek-data
    cacheTable: ${self:provider.stage}-softtek-cache
  # Configuración optimizada para Free Tier
  freeTier:
    lambda:
      memorySize: 192     # Mínimo para maximizar invocaciones gratuitas
      timeout: 120        # Necesario para APIs externas
    monitoring:
      enabled: true       # Habilitar CloudWatch básico (gratuito)

provider:
  name: aws
  runtime: nodejs20.x
  memorySize: 192
  timeout: 120
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  endpointType: REGIONAL
  apiName: softtek-backend-challenge-api-${opt:stage, 'dev'}
  environment:
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID, ''}
    STAGE: ${opt:stage, 'dev'}
    AWS_REGION: ${opt:region, 'us-east-1'}
    NODE_ENV: ${env:NODE_ENV, 'development'}
    DYNAMODB_TABLE_DATA: ${self:custom.dynamodb.dataTable}
    DYNAMODB_TABLE_CACHE: ${self:custom.dynamodb.cacheTable}
    # Variables para optimización Free Tier
    FREE_TIER_MODE: 'true'
    CACHE_TTL_SECONDS: '1800'  # 30 minutos
    LOG_LEVEL: 'info'
  # VPC configuration - COMENTADO para Free Tier
  # IMPORTANTE: VPC puede generar costos por NAT Gateway
  # Descomenta solo si necesitas acceso a recursos privados
  # vpc:
  #   securityGroupIds:
  #     - PLACEHOLDER_SECURITY_GROUP_IDS
  #   subnetIds:
  #     - PLACEHOLDER_SUBNET_IDS
  apiGateway:
    restApiId: !Ref ApiGatewayRestApi
    restApiRootResourceId: !GetAtt ApiGatewayRestApi.RootResourceId
    description: "API Gateway para Softtek Backend Challenge"
    binaryMediaTypes:
      - '*/*'
    # Configuración para remover stage del path
    shouldStartNameWithService: true
  iamRoleStatements:
    # Permisos para DynamoDB
    - Effect: Allow
      Action:
        - dynamodb:Query
        - dynamodb:Scan
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:BatchGetItem
        - dynamodb:BatchWriteItem
      Resource:
        - "arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.dynamodb.dataTable}"
        - "arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.dynamodb.cacheTable}"
        - "arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:custom.dynamodb.dataTable}/index/*"

functions:
  getFusionados:
    handler: src/modules/fusionados/controllers/fusionados.controller.handler
    description: Función para obtener datos fusionados
    events:
      - http:
          integration: lambda-proxy
          method: GET
          path: /fusionados
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref CognitoAuthorizer

  postAlmacenar:
    handler: src/modules/almacenar/controllers/almacenar.controller.handler
    description: Función para almacenar datos
    events:
      - http:
          integration: lambda-proxy
          method: POST
          path: /almacenar
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref CognitoAuthorizer

  getHistorial:
    handler: src/modules/historial/controllers/historial.controller.handler
    description: Función para obtener historial
    events:
      - http:
          integration: lambda-proxy
          method: GET
          path: /historial
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref CognitoAuthorizer

  # Función pública para health check (sin autenticación)
  healthCheck:
    handler: src/handlers/health.handler
    description: Health check endpoint (público)
    events:
      - http:
          integration: lambda-proxy
          method: GET
          path: /health
          cors: true

  # Función pública para documentación Swagger UI
  swaggerDocs:
    handler: src/handlers/swagger.handler
    description: Swagger UI documentation endpoint (público)
    events:
      - http:
          integration: lambda-proxy
          method: GET
          path: /docs
          cors: true
      - http:
          integration: lambda-proxy
          method: GET
          path: /docs/{proxy+}
          cors: true

  # Funciones para APIs externas con cache (30 minutos)
  getPeople:
    handler: src/modules/external-api/controllers/external-api.controller.getPeople
    description: Obtener personas de API externa (con cache de 30 min)
    events:
      - http:
          integration: lambda-proxy
          method: GET
          path: /external/people
          cors: true

  getPlanets:
    handler: src/modules/external-api/controllers/external-api.controller.getPlanets
    description: Obtener planetas de API externa (con cache de 30 min)
    events:
      - http:
          integration: lambda-proxy
          method: GET
          path: /external/planets
          cors: true

  getFilms:
    handler: src/modules/external-api/controllers/external-api.controller.getFilms
    description: Obtener películas de API externa (con cache de 30 min)
    events:
      - http:
          integration: lambda-proxy
          method: GET
          path: /external/films
          cors: true

  getPeopleNoCache:
    handler: src/modules/external-api/controllers/external-api.controller.getPeopleNoCache
    description: Obtener personas sin cache (siempre consulta API externa)
    events:
      - http:
          integration: lambda-proxy
          method: GET
          path: /external/people/no-cache
          cors: true

  clearCache:
    handler: src/modules/external-api/controllers/external-api.controller.clearCache
    description: Limpiar todo el cache de APIs externas
    events:
      - http:
          integration: lambda-proxy
          method: DELETE
          path: /external/cache
          cors: true

  clearCacheForEndpoint:
    handler: src/modules/external-api/controllers/external-api.controller.clearCacheForEndpoint
    description: Limpiar cache de un endpoint específico
    events:
      - http:
          integration: lambda-proxy
          method: DELETE
          path: /external/cache/{endpoint}
          cors: true

package:
  patterns:
    - "!.git/**"
    - "!.vscode/**"
    - "!README.md"
    - "!mocks/**"
    - "!node_modules/**"
    - package.json
    - package-lock.json

resources:
  Resources:
    # Cognito User Pool
    CognitoUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: softtek-backend-challenge-user-pool-${opt:stage, 'dev'}
        UsernameAttributes:
          - email
        AutoVerifiedAttributes:
          - email
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireUppercase: true
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: false
        Schema:
          - Name: email
            AttributeDataType: String
            Mutable: true
            Required: true
          - Name: name
            AttributeDataType: String
            Mutable: true
            Required: true
        EmailConfiguration:
          EmailSendingAccount: COGNITO_DEFAULT

    # Cognito User Pool Client
    CognitoUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: softtek-backend-challenge-client-${opt:stage, 'dev'}
        UserPoolId: !Ref CognitoUserPool
        GenerateSecret: false
        ExplicitAuthFlows:
          - ADMIN_NO_SRP_AUTH
          - USER_PASSWORD_AUTH
          - ALLOW_USER_SRP_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
        AccessTokenValidity: 60
        IdTokenValidity: 60
        RefreshTokenValidity: 30
        TokenValidityUnits:
          AccessToken: minutes
          IdToken: minutes
          RefreshToken: days
        PreventUserExistenceErrors: ENABLED

    # API Gateway
    ApiGatewayRestApi:
      Type: AWS::ApiGateway::RestApi
      Properties:
        Name: softtek-backend-challenge-api-${opt:stage, 'dev'}
        Description: API Gateway para Softtek Backend Challenge
        EndpointConfiguration:
          Types:
            - REGIONAL
        BinaryMediaTypes:
          - '*/*'

    # Cognito Authorizer
    CognitoAuthorizer:
      Type: AWS::ApiGateway::Authorizer
      Properties:
        Name: CognitoAuthorizer
        Type: COGNITO_USER_POOLS
        RestApiId: !Ref ApiGatewayRestApi
        IdentitySource: method.request.header.Authorization
        ProviderARNs:
          - !GetAtt CognitoUserPool.Arn

    # CORS para OPTIONS requests
    GatewayResponseDefault4XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId: !Ref ApiGatewayRestApi
        ResponseType: DEFAULT_4XX
        ResponseHeaders:
          Access-Control-Allow-Origin: "'*'"
          Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
          Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"

    GatewayResponseDefault5XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId: !Ref ApiGatewayRestApi
        ResponseType: DEFAULT_5XX
        ResponseHeaders:
          Access-Control-Allow-Origin: "'*'"
          Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
          Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"

    # DynamoDB - Tabla Principal
    DataTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.dynamodb.dataTable}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: categoria
            AttributeType: S
          - AttributeName: fechaCreacion
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: categoria-fecha-index
            KeySchema:
              - AttributeName: categoria
                KeyType: HASH
              - AttributeName: fechaCreacion
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        Tags:
          - Key: Environment
            Value: ${self:provider.stage}
          - Key: Service
            Value: softtek-backend-challenge

    # DynamoDB - Tabla de Cache con TTL
    CacheTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.dynamodb.cacheTable}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: cacheKey
            AttributeType: S
        KeySchema:
          - AttributeName: cacheKey
            KeyType: HASH
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
        Tags:
          - Key: Environment
            Value: ${self:provider.stage}
          - Key: Service
            Value: softtek-backend-challenge-cache

  Outputs:
    # API Gateway URL
    ApiGatewayUrl:
      Description: URL del API Gateway
      Value: !Sub 'https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/${opt:stage, "dev"}'
      Export:
        Name: ${self:service}-${opt:stage, 'dev'}-api-url

    # Cognito User Pool ID
    CognitoUserPoolId:
      Description: ID del Cognito User Pool
      Value: !Ref CognitoUserPool
      Export:
        Name: ${self:service}-${opt:stage, 'dev'}-user-pool-id

    # Cognito User Pool Client ID
    CognitoUserPoolClientId:
      Description: ID del Cognito User Pool Client
      Value: !Ref CognitoUserPoolClient
      Export:
        Name: ${self:service}-${opt:stage, 'dev'}-user-pool-client-id

    # Cognito User Pool ARN
    CognitoUserPoolArn:
      Description: ARN del Cognito User Pool
      Value: !GetAtt CognitoUserPool.Arn
      Export:
        Name: ${self:service}-${opt:stage, 'dev'}-user-pool-arn

    # DynamoDB Tables
    DataTableName:
      Description: Name of the DynamoDB data table
      Value: !Ref DataTable
      Export:
        Name: ${self:service}-${opt:stage, 'dev'}-data-table

    CacheTableName:
      Description: Name of the DynamoDB cache table
      Value: !Ref CacheTable
      Export:
        Name: ${self:service}-${opt:stage, 'dev'}-cache-table
